name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arch:
    name: Build Arch package
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel rust cargo git sudo

      - name: Create non-root build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build source tarball
        run: sudo -u builder ./scripts/make-pkg-source.sh

      - name: Build package
        run: sudo -u builder bash -c 'cd packaging && makepkg --nodeps --noconfirm'

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp packaging/*.pkg.tar.zst dist/

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/*

  build-rpm:
    name: Build RPM package
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: dnf install -y cargo rust rpm-build gcc

      - name: Build source tarball
        run: ./scripts/make-pkg-source.sh

      - name: Build RPM
        run: |
          mkdir -p ~/rpmbuild/{SOURCES,SPECS,RPMS,SRPMS,BUILD,BUILDROOT}
          cp packaging/kde-fusion-*.tar.gz ~/rpmbuild/SOURCES/
          rpmbuild -bb packaging/kde-fusion.spec

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find ~/rpmbuild/RPMS -type f -name '*.rpm' -exec cp {} dist/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: dist/*

  build-deb:
    name: Build Debian package
    runs-on: ubuntu-latest
    container: rust:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends debhelper dpkg-dev build-essential

      - name: Prepare Debian packaging
        run: cp -r packaging/debian debian

      - name: Build deb
        run: dpkg-buildpackage -us -uc -b

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp ../*.deb dist/ 2>/dev/null || cp /*.deb dist/ 2>/dev/null || true
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*

  release:
    name: Publish release
    needs: [build-arch, build-rpm, build-deb]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "KDE Fusion ${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}"